databases:
  - name: itgo-db
    plan: starter     # 無料枠
    region: oregon    # 任意

services:
  - type: web
    name: itgo-backend
    env: node
    region: oregon
    branch: feature/itgo-backend
    buildCommand: |
      cd backend
      npm install
    startCommand: |
      cd backend
      npm start
    envVars:
      - key: PORT
        value: "3001"
      - key: FRONTEND_ORIGIN
        value: https://<your‑frontend‑service‑url>
      - key: DATABASE_HOST       # 後述のままでも OK
        fromDatabase:
          name: itgo-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: itgo-db
          property: port
      - key: DATABASE_USER
        fromDatabase:
          name: itgo-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: itgo-db
          property: password
      - key: DATABASE_NAME
        fromDatabase:
          name: itgo-db
          property: database
  - type: web
    name: itgo-frontend
    runtime: static
    branch: feature/itgo-frontend
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://<your‑backend‑service‑url>/api/questions