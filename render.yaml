services:
  - type: web
    name: itgo-backend
    runtime: node
    plan: free
    region: oregon
    branch: feature/itgo-backend
    buildCommand: |
      cd backend
      npm install
    startCommand: |
      cd backend
      npm start
    envVars:
      - key: PORT
        value: "3001"
      - key: FRONTEND_ORIGIN
        value: https://<your-frontend-service-url>
      # DATABASE_* 環境変数はマネージド DB を別途作成した後にダッシュボードで追加してください

  - type: web
    name: itgo-frontend
    runtime: static
    plan: free
    branch: feature/itgo-frontend
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://<your-backend-service-url>/api/questions