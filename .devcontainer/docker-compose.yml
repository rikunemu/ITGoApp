version: '3.8'

services:
  # 1. 開発コンテナの定義（React/Node.js環境）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # プロジェクト全体をコンテナの /workspace にマウント
      - ..:/workspace:cached
    # コンテナがVS Codeによって接続されるまで停止しないようにする
    command: /bin/sh -c "sleep infinity"
    environment:
      # アプリケーションからDBに接続するための環境変数 (ホスト名はサービス名 'db')
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: user
      DATABASE_PASSWORD: password
      DATABASE_NAME: dev_db
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy  # DBが正常になるまで待機

  # 2. PostgreSQL データベースコンテナの定義
  db:
    # 最新の安定版 PostgreSQL 16 の alpine版を使用 (軽量なイメージ)
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # データベース接続情報 (dev_dbというDBを初期作成)
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dev_db
      POSTGRES_INITDB_ARGS: "--locale=ja_JP.UTF-8"
    volumes:
      # データを永続化するためのボリューム
      - db-data:/var/lib/postgresql/data
      # initdbスクリプトをマウント（起動時に自動実行）
      # Postgresは /docker-entrypoint-initdb.d 配下のファイルを実行するため、直接マウントする
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # ホストマシンの5432ポートをコンテナの5432ポートに転送
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. マイグレーション実行用ジョブコンテナ
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../backend:/app:ro
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: user
      DATABASE_PASSWORD: password
      DATABASE_NAME: dev_db
    working_dir: /app
    command: sh -c "npm install --omit=dev && npm run migrate"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  # データベースのデータ保存用ボリューム
  db-data: